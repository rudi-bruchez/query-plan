<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plan d'exécution</title>
<link rel="stylesheet" href="qp/qp.css">
<script src="qp/qp.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1f2328; }
  #rendu { padding: .5rem; }
  #rendu.pev2 { display: flex; flex-direction: column; height: calc(100vh - 2.2rem); padding: 0; }
  #pied { font-size: .85rem; padding: 0 .5rem .5rem; }
  a { color: #0969da; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="dark"] body { background: #0d1117; color: #e6edf3; }
  html[data-theme="dark"] a { color: #4493f8; }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] body { background: #0d1117; color: #e6edf3; }
    html[data-theme="auto"] a { color: #4493f8; }
  }
</style>
</head>
<body>
<div id="rendu"></div>
<div id="pied"></div>
<script>
// Usage : https://sqlplan.pachadata.com/?p=<nom>[&theme=light|dark][&node=<NodeId>]
// affiche plans/<nom>.sqlplan (SQL Server), sinon plans/<nom>.pgplan (EXPLAIN de PostgreSQL
// au format JSON, dessiné par pev2). node : l'opérateur de ce NodeId et ce qu'il lit
// (SQL Server seulement). Thème du système par défaut ; une page claire (Moodle) passe theme=light.
var params = new URLSearchParams(location.search);
var nom = params.get("p") || "";
var theme = params.get("theme");
if (theme !== "light" && theme !== "dark") theme = "auto";
document.documentElement.setAttribute("data-theme", theme);
var rendu = document.getElementById("rendu");
var pied = document.getElementById("pied");

function lire(url) {
  return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
}

function telecharger(url, fichier, texte) {
  var a = document.createElement("a");
  a.href = url; a.download = fichier; a.textContent = texte;
  pied.appendChild(a);
}

// pev2 et ce dont il dépend ne se chargent que pour un plan PostgreSQL
function chargerPev2() {
  ["pev2/bootstrap.min.css", "pev2/pev2.css"].forEach(function (href) {
    var l = document.head.appendChild(document.createElement("link"));
    l.rel = "stylesheet"; l.href = href;
  });
  return ["pev2/vue.global.prod.js", "pev2/pev2.umd.js"].reduce(function (suite, src) {
    return suite.then(function () {
      return new Promise(function (ok, ko) {
        var s = document.head.appendChild(document.createElement("script"));
        s.src = src; s.onload = ok; s.onerror = ko;
      });
    });
  }, Promise.resolve());
}

function afficherPg(texte, url) {
  // pev2 suit le data-bs-theme de Bootstrap
  var sombre = window.matchMedia("(prefers-color-scheme: dark)");
  var appliquer = function () {
    document.documentElement.setAttribute("data-bs-theme", theme === "auto" ? (sombre.matches ? "dark" : "light") : theme);
  };
  appliquer();
  sombre.addEventListener("change", appliquer);
  rendu.className = "pev2";
  return chargerPev2().then(function () {
    Vue.createApp({ render: function () { return Vue.h(pev2.Plan, { planSource: texte, planQuery: "" }); } }).mount(rendu);
    telecharger(url, nom + ".json", "Télécharger le plan (JSON d'EXPLAIN)");
  });
}

if (!/^[\w-]+$/.test(nom)) {
  rendu.textContent = "Paramètre ?p= manquant ou invalide.";
} else {
  var url = "plans/" + nom + ".sqlplan";
  lire(url)
    .then(function (xml) {
      var node = params.get("node");
      QP.showPlan(rendu, xml, { theme: theme, fitWidth: 0.6, nodeId: /^\d+$/.test(node || "") ? node : null });
      telecharger(url, nom + ".sqlplan", "Télécharger le plan (à ouvrir dans SSMS)");
    }, function () {
      var urlPg = "plans/" + nom + ".pgplan";
      return lire(urlPg).then(function (texte) { return afficherPg(texte, urlPg); });
    })
    .catch(function () { rendu.textContent = "Le plan « " + nom + " » n'a pas pu être chargé."; });
}
</script>
</body>
</html>
