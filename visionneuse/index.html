<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plan d'exécution</title>
<link rel="stylesheet" href="qp/qp.css">
<script src="qp/qp.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1f2328; }
  #rendu { padding: .5rem; }
  #pied { font-size: .85rem; padding: 0 .5rem .5rem; }
  a { color: #0969da; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="dark"] body { background: #0d1117; color: #e6edf3; }
  html[data-theme="dark"] a { color: #4493f8; }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] body { background: #0d1117; color: #e6edf3; }
    html[data-theme="auto"] a { color: #4493f8; }
  }
</style>
</head>
<body>
<div id="rendu"></div>
<div id="pied"></div>
<script>
// Usage : https://sqlplan.pachadata.com/?p=<nom>[&theme=light|dark] affiche plans/<nom>.sqlplan,
// dans le thème du système par défaut ; une page claire (Moodle) qui l'intègre passe theme=light.
var params = new URLSearchParams(location.search);
var nom = params.get("p") || "";
var theme = params.get("theme");
if (theme !== "light" && theme !== "dark") theme = "auto";
document.documentElement.setAttribute("data-theme", theme);
var rendu = document.getElementById("rendu");
var pied = document.getElementById("pied");
if (!/^[\w-]+$/.test(nom)) {
  rendu.textContent = "Paramètre ?p= manquant ou invalide.";
} else {
  var url = "plans/" + nom + ".sqlplan";
  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (xml) {
      QP.showPlan(rendu, xml, { theme: theme, fitWidth: 0.6 });
      var a = document.createElement("a");
      a.href = url; a.download = nom + ".sqlplan"; a.textContent = "Télécharger le plan (à ouvrir dans SSMS)";
      pied.appendChild(a);
    })
    .catch(function () { rendu.textContent = "Le plan « " + nom + " » n'a pas pu être chargé."; });
}
</script>
</body>
</html>
